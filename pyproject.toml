[project]
name = "ordinalshap"
version = "0.1.0"
description = "Task-oriented Shapley payoff for ordinal LLM text classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib",  "openai"]

[project.optional-dependencies]
baselines = ["scikit-learn", "rank-bm25", "sentence-transformers"]
google = ["google-genai"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ordinalshap*"]